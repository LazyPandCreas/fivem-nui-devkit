services:
  db:
    image: mariadb:11
    container_name: fivem-devkit-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: devkit_root
      MARIADB_DATABASE: fivem_devkit
      MARIADB_USER: devkit
      MARIADB_PASSWORD: devkit
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  # Interfaccia web per ispezionare il DB senza client MySQL: http://localhost:8080
  adminer:
    image: adminer
    container_name: fivem-devkit-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
